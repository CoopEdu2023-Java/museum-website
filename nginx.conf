server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    # 为 React 应用设置路由规则
    location / {
        index index.html;
        try_files $uri /index.html; # 将所有未匹配的路由重定向到 index.html
    }

    # 可选：配置静态文件的缓存
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html; # 遇到 404 时也重定向到 index.html
}